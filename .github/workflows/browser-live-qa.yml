name: Phase 08 real-browser website QA

on:
  workflow_dispatch:
  # Test only after GitHub Pages has finished publishing. Running on push
  # raced with the deployment and could test an unrelated or stale root site.
  workflow_run:
    workflows: ["Publish Career-Ops dashboard"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: career-ops-live-browser-qa
  cancel-in-progress: true

jobs:
  real-browser-qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Career-Ops
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Playwright and isolated Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test the deployed site in real desktop and mobile browsers
        env:
          CAREEROPS_LIVE_ORIGIN: https://chennamatta889.github.io/career-ops-cloud
        run: node scripts/browser-live-smoke.mjs
