name: Publish Career-Ops dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - match-engine.js
      - ai-studio.js
      - private-workspace.js
      - scripts/private-workspace.test.cjs
      - scripts/phase45-stability.test.cjs
      - scripts/navigation-ui.test.cjs
      - scripts/health-check.test.cjs
      - scripts/live-smoke.mjs
      - health-check.js
      - resume-parser.js
      - careerops-config.js
      - scripts/ai-studio.test.cjs
      - scripts/auth-email-limit.test.cjs
      - scripts/google-oauth.test.cjs
      - scripts/check-google-provider.mjs
      - scripts/resume-parser.test.cjs
      - scripts/resume-upload-ui.test.cjs
      - scripts/job-fetch.test.mjs
      - scripts/match-engine.test.cjs
      - scripts/export-scan-feed.mjs
      - scripts/universal-job-scan.mjs
      - scripts/universal-job-scan.test.mjs
      - scripts/universal-job-sources.json
      - job-categories.js
      - job-text.js
      - scripts/job-text.test.cjs
      - scripts/export-scan-feed.test.mjs
      - .github/workflows/deploy-ui.yml
      - resources/**
      - resource-styles.css
      - about.html
      - contact.html
      - privacy.html
      - terms.html
      - ads.txt
      - robots.txt
      - sitemap.xml
  schedule:
    # 10:00 AM India Standard Time. GitHub schedules may run late.
    - cron: '30 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: career-ops-ui-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # All-role discovery uses the maintained read-only ATS importer in
      # this repository. No applicant profile, role exclusions or region cap.
      # The prior upstream profile filtered out almost every non-IT opening.
      - name: Install pinned, browser-only resume parsing libraries
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/career-ops-vendor" --no-save --package-lock=false --ignore-scripts --omit=optional --no-audit --no-fund pdfjs-dist@5.4.624 mammoth@1.11.0
          test -s "$RUNNER_TEMP/career-ops-vendor/node_modules/pdfjs-dist/build/pdf.min.mjs"
          test -s "$RUNNER_TEMP/career-ops-vendor/node_modules/pdfjs-dist/build/pdf.worker.min.mjs"
          test -s "$RUNNER_TEMP/career-ops-vendor/node_modules/mammoth/mammoth.browser.min.js"

      - name: Validate dashboard and public-feed features
        run: |
          node --check app.js
          node --check match-engine.js
          node --check job-categories.js
          node --check job-text.js
          node --check scripts/universal-job-scan.mjs
          node --check ai-studio.js
          node --check private-workspace.js
          node --check health-check.js
          node --check scripts/live-smoke.mjs
          node --check resume-parser.js
          node --check supabase/functions/careerops-ai-review/job-fetch.mjs
          node --check careerops-config.js
          node --check scripts/check-google-provider.mjs
          node --test scripts/universal-job-scan.test.mjs scripts/export-scan-feed.test.mjs scripts/match-engine.test.cjs scripts/job-text.test.cjs scripts/ai-studio.test.cjs scripts/auth-email-limit.test.cjs scripts/google-oauth.test.cjs scripts/private-workspace.test.cjs scripts/phase45-stability.test.cjs scripts/navigation-ui.test.cjs scripts/health-check.test.cjs scripts/resume-parser.test.cjs scripts/resume-upload-ui.test.cjs scripts/job-fetch.test.mjs

      - name: Verify Google provider is enabled in Career-Ops Supabase
        id: google_auth_check
        continue-on-error: true
        run: node scripts/check-google-provider.mjs

      - name: Scan all IT and non-IT public employer jobs
        shell: bash
        run: |
          mkdir -p public/data
          FEED_OUTPUT="public/data/jobs.json" node scripts/universal-job-scan.mjs

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p public
          cp index.html styles.css match-engine.js job-categories.js job-text.js careerops-config.js app.js resume-parser.js ai-studio.js private-workspace.js health-check.js public/
          # Browser caches must not pair a previous dashboard script with new markup.
          sed -i -e "s|?v=20261121-experience-filter-v1|?v=$GITHUB_RUN_ID|g" \
            -e "s|?v=20261121-application-confirmation-v1|?v=$GITHUB_RUN_ID|g" public/index.html
          grep -Fq "./app.js?v=$GITHUB_RUN_ID" public/index.html
          grep -Fq "./private-workspace.js?v=$GITHUB_RUN_ID" public/index.html
          grep -q 'id="applicationFollowup"' public/index.html
          grep -q 'id="confirmAppliedDate"' public/index.html
          grep -Fq "./job-text.js?v=$GITHUB_RUN_ID" public/index.html
          grep -Fq 'id="experienceFilter"' public/index.html
          cp about.html contact.html privacy.html terms.html resource-styles.css ads.txt robots.txt sitemap.xml public/
          cp -R resources public/resources
          mkdir -p public/vendor
          cp "$RUNNER_TEMP/career-ops-vendor/node_modules/pdfjs-dist/build/pdf.min.mjs" public/vendor/
          cp "$RUNNER_TEMP/career-ops-vendor/node_modules/pdfjs-dist/build/pdf.worker.min.mjs" public/vendor/
          cp "$RUNNER_TEMP/career-ops-vendor/node_modules/mammoth/mammoth.browser.min.js" public/vendor/
          test -s public/data/jobs.json
          test -s public/vendor/pdf.min.mjs
          test -s public/vendor/pdf.worker.min.mjs
          test -s public/vendor/mammoth.browser.min.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Allow Pages artifact metadata to propagate
        # upload-pages-artifact may succeed before the Actions artifact index
        # is queryable by deploy-pages. This reduces transient "0 artifacts" errors.
        run: sleep 12

      - name: Deploy public dashboard
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment and anonymous AI denial
        run: node scripts/live-smoke.mjs
