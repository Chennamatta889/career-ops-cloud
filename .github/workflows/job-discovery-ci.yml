name: Validate job discovery (no deployment)

on:
  pull_request:
    paths:
      - 'scripts/universal-job-scan.mjs'
      - 'scripts/universal-job-scan.test.mjs'
      - 'scripts/universal-job-sources.json'
      - 'job-search.js'
      - 'india-jobs.js'
      - 'scripts/india-jobs.test.cjs'
      - 'scripts/guard-public-feed.mjs'
      - 'scripts/guard-public-feed.test.mjs'
      - 'scripts/navigation-ui.test.cjs'
      - 'scripts/phase45-stability.test.cjs'
      - 'app.js'
      - 'external-job-search.js'
      - 'scripts/external-job-search.test.cjs'
      - 'scripts/enterprise-careers.test.cjs'
      - 'scripts/ai-studio.test.cjs'
      - '.github/workflows/deploy-ui.yml'
      - 'index.html'
      - 'scripts/job-search.test.cjs'
      - 'job-categories.js'
      - 'job-text.js'
      - '.github/workflows/job-discovery-ci.yml'
  push:
    branches:
      - 'fix/servicenow-smartrecruiters-india-20261121'
      - 'feat/india-job-portals-workable-20261121'
      - 'fix/india-source-release-tests-20261121'
      - 'feat/india-only-job-discovery-20261121'
      - 'fix/india-only-release-fixtures-20261121'

permissions:
  contents: read

jobs:
  test-public-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and public ATS test suite
        run: |
          node --check scripts/universal-job-scan.mjs
          node --check scripts/universal-job-scan.test.mjs
          node --check job-search.js
          node --check india-jobs.js
          node --check scripts/guard-public-feed.mjs
          node --check app.js
          node --check external-job-search.js
          node --check scripts/job-search.test.cjs
          node --test scripts/universal-job-scan.test.mjs scripts/india-jobs.test.cjs scripts/guard-public-feed.test.mjs scripts/navigation-ui.test.cjs scripts/phase45-stability.test.cjs scripts/job-search.test.cjs scripts/external-job-search.test.cjs scripts/ai-studio.test.cjs scripts/enterprise-careers.test.cjs
